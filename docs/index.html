<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updater Manager | Setup</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="background-animation"></div>

    <main class="container">
        <header>
            <div class="logo-wrapper">
                <i class="fas fa-box-open logo-icon"></i>
                <h1>Updater Manager</h1>
            </div>
            <p class="subtitle">Gerencie pacotes no Ubuntu com facilidade e persistência.</p>
        </header>

        <section class="installation-section">
            <div class="command-box">
                <span class="prompt">$</span>
                <code id="installCommand">curl -fsSL https://luizhanauer.github.io/updater-manager/get.sh | sh</code>
                <button id="copyBtn" onclick="copyCommand()" title="Copiar comando">
                    <i class="far fa-copy"></i>
                </button>
            </div>
        </section>

        <section class="links-section">
            <a href="https://github.com/luizhanauer/updater-manager" target="_blank" class="btn-github">
                <i class="fab fa-github"></i> Ver no GitHub
            </a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
