name: Release and Deploy Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: COMPILAÇÃO E RELEASE (Roda só em Tags)
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v6.0.2

      - name: 🐹 Configurar Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.6'

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '22'

      - name: 🔧 Instalar Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: 🔨 Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 🔨 Compilar Daemon
        run: |
          mkdir -p dist/bin
          cd daemon
          go mod tidy
          go build -ldflags="-s -w" -o ../dist/bin/updater-daemon

      - name: 🔨 Compilar Client
        run: |
          cd client
          go mod tidy
          wails build -platform linux/amd64 -tags webkit2_41 -clean -o updater-client
          mv build/bin/updater-client ../dist/bin/

      - name: 📦 Criar Tarball (.tar.gz)
        run: |
          # CORREÇÃO: Apontando para a pasta build/ correta
          cp build/install.sh dist/
          cp build/updater-daemon.service dist/
          cp build/updater-client.desktop dist/
          
          chmod +x dist/install.sh
          chmod +x dist/bin/*
          
          VERSION=${{ github.ref_name }}
          ARCH="amd64"
          FILENAME="updater-manager_linux_${ARCH}.tar.gz"
          
          cd dist
          tar -czf ../$FILENAME *
          echo "ASSET_PATH=$FILENAME" >> $GITHUB_ENV

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # JOB 2: DEPLOY DO SITE (Aguarda o Job 1 terminar)
  deploy-pages:
    needs: build-and-release
    if: always() && (needs.build-and-release.result == 'success' || needs.build-and-release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v6.0.2

      - name: 🏗️ Montar Estrutura do Site
        run: |
          mkdir -p _site/assets
          cp -r docs/* _site/
          cp get.sh _site/
          cp -r portfolio-assets/* _site/assets/ 2>/dev/null || true

      - name: 📤 Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4