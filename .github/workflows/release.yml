name: Release and Deploy Pages

on:
  push:
    branches:
      - main # Necessário para atualizar o site sem precisar criar uma tag
    tags:
      - 'v*' # Dispara a Release do binário
  workflow_dispatch:

permissions:
  contents: write # Permissão para Releases
  pages: write    # Permissão para o GitHub Pages
  id-token: write # Permissão de autenticação do Pages

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v6.0.2

      - name: 🐹 Configurar Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.6'

      - name: 🟢 Configurar Node (para o Wails/Vue)
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '22'

      - name: 🔧 Instalar Dependências do Linux (Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: 🔨 Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- COMPILAÇÃO DO DAEMON ---
      - name: 🔨 Compilar Daemon
        run: |
          # CORREÇÃO: Criar o diretório antes de compilar
          mkdir -p dist/bin
          
          cd daemon
          go mod tidy
          # Compila estático e otimizado (-s -w)
          go build -ldflags="-s -w" -o ../dist/bin/updater-daemon

      # --- COMPILAÇÃO DO CLIENT ---
      - name: 🔨 Compilar Client
        run: |
          cd client
          go mod tidy
          # O Wails compila o Frontend + Backend
          wails build -platform linux/amd64 -tags webkit2_41 -clean -o updater-client
          
          # Move o binário gerado para a pasta de distribuição
          mv build/bin/updater-client ../dist/bin/

      # --- EMPACOTAMENTO ---
      - name: 📦 Criar Tarball (.tar.gz)
        run: |
          # Copia os arquivos de instalação para a pasta dist
          cp install.sh dist/
          cp updater-daemon.service dist/
          cp updater-client.desktop dist/
          
          # Garante permissão de execução
          chmod +x dist/install.sh
          chmod +x dist/bin/*
          
          # Define o nome do arquivo baseado na Tag
          VERSION=${{ github.ref_name }}
          ARCH="amd64"
          FILENAME="updater-manager_linux_${ARCH}.tar.gz"
          
          # Entra na pasta dist e compacta tudo
          cd dist
          tar -czf ../$FILENAME *
          
          # Salva o nome do arquivo numa variável de ambiente
          echo "ASSET_PATH=$FILENAME" >> $GITHUB_ENV

      # --- PUBLICAÇÃO ---
      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # --- DEPLOY DO SITE NO GITHUB PAGES ---
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v6.0.2

      - name: 🏗️ Montar Estrutura do Site
        run: |
          # Cria a estrutura temporária
          mkdir -p _site/assets
          
          # Copia os arquivos do site
          cp -r docs/* _site/
          
          # Copia o script para a raiz do site
          cp get.sh _site/
          
          # Mapeia as imagens corretamente
          cp -r portfolio-assets/* _site/assets/ 2>/dev/null || true

      - name: 📤 Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4