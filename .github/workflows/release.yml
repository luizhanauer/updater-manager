name: Release and Deploy Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐹 Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Versão estável recomendada

      - name: 🟢 Configurar Node (para o Wails/Vue)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔧 Instalar Dependências do Linux (Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: 🔨 Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 🔨 Compilar Daemon
        run: |
          mkdir -p dist/bin
          cd daemon
          go mod tidy
          go build -ldflags="-s -w" -o ../dist/bin/updater-daemon

      - name: 🔨 Compilar Client
        run: |
          cd client
          go mod tidy
          wails build -platform linux/amd64 -tags webkit2_41 -clean -o updater-client
          mv build/bin/updater-client ../dist/bin/

      - name: 📦 Criar Tarball (.tar.gz)
        run: |
          cp install.sh dist/
          cp updater-daemon.service dist/
          cp updater-client.desktop dist/
          chmod +x dist/install.sh
          chmod +x dist/bin/*
          
          VERSION=${{ github.ref_name }}
          FILENAME="updater-manager_linux_amd64.tar.gz"
          
          cd dist
          tar -czf ../$FILENAME *
          echo "ASSET_PATH=$FILENAME" >> $GITHUB_ENV

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🏗️ Montar Estrutura do Site
        run: |
          # 1. Cria diretório temporário para o site
          mkdir -p _site/assets
          
          # 2. Copia os arquivos base do HTML (da pasta docs)
          cp -r docs/* _site/
          
          # 3. Copia o script de instalação para a RAIZ do site
          cp get.sh _site/
          
          # 4. Mapeia portfolio-assets para /assets no site final
          cp -r portfolio-assets/* _site/assets/
          
          echo "Estrutura do site criada:"
          ls -R _site

      - name: 📤 Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4